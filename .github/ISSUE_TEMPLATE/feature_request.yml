name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提出新功能前请先搜索已有 Issue，避免重复。
        大规模改动建议先在此讨论方案，达成一致后再动手写代码。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前遇到的困难或痛点，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有别的实现思路？为什么不选它们？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 小改动（局部）
        - 中等（涉及多个模块）
        - 较大（需要架构调整）
    validations:
      required: true
