name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      # demo/index.html 是自包含单文件页面，无需构建，直接上传整个目录
      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
