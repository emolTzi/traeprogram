name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：工作流只需读代码
permissions:
  contents: read

# 同一分支的新推送会取消上一次未完成的运行，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 注意：作业名 `build` 被 main 分支保护规则引用为必需检查。
  # 重命名此作业会导致 PR 永远等不到检查结果，务必同步修改分支保护配置。
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
