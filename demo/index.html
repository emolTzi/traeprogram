      };
      const BOX_COLORS = ['#8ec5ff', '#ffc97a', '#a8e0a0', '#f5a3b6', '#c9b8ff'];

      /* =====================================================================
       * 9. 界面状态与渲染
       * ===================================================================== */
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      const state = {
        map: MAPS[0],
        blocked: new Set(),
        cleared: new Set(),
        closed: new Set(),
        robot: null,
        mode: 'view',
        trace: null,
        sim: null,
        simGoals: [],
        clarifications: {},
        lastText: '',
        history: [],
        historyIdx: -1,
        events: [],
        showExplored: false,
        showCoords: false,
        speed: 4,
        heading: 0,
        lastFrame: 0,
        painting: null,
        pathSig: '',
        markerSig: '',
        traveledLen: -1,
        view: '2d',
      };
      const overrides = () => ({
        blocked: [...state.blocked].map(parseKey),
        cleared: [...state.cleared].map(parseKey),
        closedPassages: [...state.closed],
      });
      const currentGrid = () => createGrid(state.map, overrides());

      function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toast.h);
        toast.h = setTimeout(() => t.classList.remove('show'), 2200);
      }

      function selectMap(id) {
        stopSim();
        state.map = MAPS.find((m) => m.id === id);
        state.blocked.clear();
        state.cleared.clear();
        state.closed = new Set(resolveClosed(state.map));
        state.robot = { ...state.map.locations.find((l) => l.id === state.map.defaultStart).anchor };
        state.trace = null;
        state.clarifications = {};
        state.events = [];
        renderSidebar();
        renderStatic();
        renderDynamic();
        renderInspector();
        renderLog();
      }
      function stopSim() {
        if (state.sim) {
          const snap = state.sim.getSnapshot();
          state.robot = { ...snap.currentCell };
        }
        state.sim = null;
      }

      /* ---------- 侧栏 ---------- */
      function renderSidebar() {
        const m = state.map;
        $('presets').innerHTML = m.presets
          .map(
            (p, i) =>
              `<button class="chip" data-preset="${i}" title="${esc(p.text)}"><span class="dot ${p.expect.outcome}"></span>${esc(p.label)}</button>`,
          )
          .join('');
        $('passages').innerHTML =
          m.passages
            .map((p) => {
              const on = state.closed.has(p.id);
              return `<div class="list-item"><span class="sw" style="background:${on ? '#ff3b30' : '#0071e3'};opacity:${on ? 1 : 0.55}"></span><span class="grow">${esc(p.name)}</span><span class="state ${on ? 'on' : ''}">${on ? '已封闭' : '开放'}</span><button class="switch ${on ? 'on' : ''}" data-passage="${p.id}" role="switch" aria-checked="${on}" aria-label="封闭${esc(p.name)}"></button></div>`;
            })
            .join('') || '<div class="list-item"><span class="hint">本地图没有可开关的通道</span></div>';
        $('locations').innerHTML = m.locations
          .map(
            (l) =>
              `<div class="list-item"><span class="sw" style="background:${CATEGORY[l.category].color}"></span><span class="grow">${esc(l.name)}<span class="coord">${fmt(l.anchor)}</span></span><button class="link" data-goto="${l.id}">前往</button><button class="link" data-place="${l.id}">放置</button></div>`,
          )
          .join('');
      }

      /* ---------- 静态层：地面 / 立体障碍 / 地点 ---------- */
      function rectPath(cells, inset = 0, r = 0) {
        const s = CELL - 2 * inset;
        if (!r)
          return cells.map((c) => `M${c.x * CELL + inset} ${c.y * CELL + inset}h${s}v${s}h${-s}z`).join('');
        return cells
          .map((c) => {
            const x = c.x * CELL + inset,
              y = c.y * CELL + inset;
            return `M${x + r} ${y}h${s - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}v${s - 2 * r}a${r} ${r} 0 0 1 ${-r} ${r}h${-(s - 2 * r)}a${r} ${r} 0 0 1 ${-r} ${-r}v${-(s - 2 * r)}a${r} ${r} 0 0 1 ${r} ${-r}z`;
          })
          .join('');
      }
      /* 墙体：把相邻墙格合并成圆角块（只在外露的角上倒圆） */
      function wallPath(map, cells, inset, r) {
        const isWall = (x, y) => terrainAt(map, { x, y }) === 'wall';
        return cells
          .map(({ x, y }) => {
            const L = x * CELL,
              T = y * CELL,
              R = L + CELL,
              B = T + CELL;
            const up = isWall(x, y - 1),
              dn = isWall(x, y + 1),
              lf = isWall(x - 1, y),
              rt = isWall(x + 1, y);
            const rTL = !up && !lf ? r : 0,
              rTR = !up && !rt ? r : 0,
              rBR = !dn && !rt ? r : 0,
              rBL = !dn && !lf ? r : 0;
            const l = lf ? L : L + inset,
              t = up ? T : T + inset,
              rr = rt ? R : R - inset,
              b = dn ? B : B - inset;
            return `M${l + rTL} ${t}H${rr - rTR}${rTR ? `A${rTR} ${rTR} 0 0 1 ${rr} ${t + rTR}` : ''}V${b - rBR}${rBR ? `A${rBR} ${rBR} 0 0 1 ${rr - rBR} ${b}` : ''}H${l + rBL}${rBL ? `A${rBL} ${rBL} 0 0 1 ${l} ${b - rBL}` : ''}V${t + rTL}${rTL ? `A${rTL} ${rTL} 0 0 1 ${l + rTL} ${t}` : ''}Z`;
          })
          .join('');
      }
      function labelWidth(text) {
        return [...text].reduce((w, ch) => w + (/[一-鿿]/.test(ch) ? 12 : 7.2), 0) + 26;
      }
      function renderStatic() {
        const m = state.map,
          W = m.width * CELL,
          H = m.height * CELL;
        const svg = $('map');
        svg.setAttribute('viewBox', `${-PAD} ${-PAD} ${W + 2 * PAD} ${H + 2 * PAD}`);
        const byKind = { wall: [], table: [], shelf: [], machine: [] };
        for (let y = 0; y < m.height; y++)
          for (let x = 0; x < m.width; x++) {
            const k = terrainAt(m, { x, y });
            if (k !== 'floor') byKind[k].push({ x, y });
          }
        const grad = (id, [a, b]) =>
          `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
        let s = `<defs>
    <pattern id="tiles" width="${CELL * 2}" height="${CELL * 2}" patternUnits="userSpaceOnUse"><rect width="${CELL * 2}" height="${CELL * 2}" fill="${ART.floor}"/><rect width="${CELL}" height="${CELL}" fill="${ART.floorAlt}"/><rect x="${CELL}" y="${CELL}" width="${CELL}" height="${CELL}" fill="${ART.floorAlt}"/></pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffd28a"/><rect width="3.5" height="7" fill="${ART.dyn}"/></pattern>
    <pattern id="barrier" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="9" height="9" fill="#ffffff"/><rect width="4.5" height="9" fill="${ART.passageClosed}"/></pattern>
    ${grad('gWall', ART.wallTop)}${grad('gTable', ART.tableTop)}${grad('gShelf', ART.shelfTop)}${grad('gMachine', ART.machineTop)}
    <radialGradient id="gRobot" cx="0.38" cy="0.32" r="0.8"><stop offset="0" stop-color="${ART.robotBody[0]}"/><stop offset="1" stop-color="${ART.robotBody[1]}"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#000" flood-opacity=".14"/></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.6" flood-color="#000" flood-opacity=".18"/></filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>`;
        s += `<rect x="-10" y="-10" width="${W + 20}" height="${H + 20}" rx="16" fill="${ART.plate}" filter="url(#lift)"/>`;
        s += `<rect width="${W}" height="${H}" rx="6" fill="url(#tiles)"/>`;
        let gl = '';
        for (let x = 1; x < m.width; x++) gl += `M${x * CELL} 0V${H}`;
        for (let y = 1; y < m.height; y++) gl += `M0 ${y * CELL}H${W}`;
        s += `<path d="${gl}" stroke="${ART.grid}" stroke-width="1" fill="none"/>`;
        // 地点区域：柔和底色
        m.locations.forEach((l) => {
          if (!l.area) return;
          const c = CATEGORY[l.category].color,
            a = l.area,
            wide = l.category === 'storage' || l.category === 'corridor';
          s += `<rect x="${a.x * CELL + 3}" y="${a.y * CELL + 3}" width="${a.w * CELL - 6}" height="${a.h * CELL - 6}" rx="10" fill="${c}" fill-opacity="${wide ? 0.05 : 0.1}" stroke="${c}" stroke-opacity="${wide ? 0.3 : 0.4}" stroke-width="1.2" ${wide ? 'stroke-dasharray="4 4"' : ''}/>`;
        });
        // 墙体：侧面 + 顶面渐变 + 顶部高光
        if (byKind.wall.length) {
          const d = wallPath(m, byKind.wall, 2, 6);
          s += `<path d="${d}" fill="${ART.wallSide}" transform="translate(0 3.5)"/><path d="${d}" fill="url(#gWall)"/>`;
        }
        // 桌台
        if (byKind.table.length) {
          const d = rectPath(byKind.table, 3, 5);
          s += `<path d="${d}" fill="${ART.tableSide}" transform="translate(0 3)"/><path d="${d}" fill="url(#gTable)"/><path d="${d}" fill="none" stroke="${ART.tableEdge}" stroke-width="1"/>`;
          byKind.table.forEach((c) => {
            s += `<rect x="${c.x * CELL + 9}" y="${c.y * CELL + 11}" width="14" height="9" rx="2" fill="#ffffff" fill-opacity=".55"/>`;
          });
        }
        // 货架：木框 + 彩色货箱
        if (byKind.shelf.length) {
          const d = rectPath(byKind.shelf, 3, 4);
          s += `<path d="${d}" fill="${ART.shelfSide}" transform="translate(0 3)"/><path d="${d}" fill="url(#gShelf)"/>`;
          byKind.shelf.forEach((c, i) => {
            const x = c.x * CELL,
              y = c.y * CELL;
            s += `<rect x="${x + 7}" y="${y + 7}" width="8" height="8" rx="1.5" fill="${BOX_COLORS[(c.x * 7 + c.y * 3) % 5]}"/><rect x="${x + 17}" y="${y + 9}" width="8" height="6" rx="1.5" fill="${BOX_COLORS[(c.x * 5 + c.y * 11 + 2) % 5]}"/>`;
            s += `<rect x="${x + 6}" y="${y + 18}" width="20" height="1.4" rx=".7" fill="#ffffff" fill-opacity=".45"/><rect x="${x + 9}" y="${y + 20.5}" width="7" height="5" rx="1.2" fill="${BOX_COLORS[(c.x + c.y * 2 + i) % 5]}" opacity=".9"/>`;
          });
        }
        // 设备：金属机箱 + 绿色指示灯
        if (byKind.machine.length) {
          const d = rectPath(byKind.machine, 3, 6);
          s += `<path d="${d}" fill="${ART.machineSide}" transform="translate(0 3)"/><path d="${d}" fill="url(#gMachine)"/>`;
          byKind.machine.forEach((c) => {
            const x = c.x * CELL,
              y = c.y * CELL;
            s += `<rect x="${x + 8}" y="${y + 15}" width="16" height="2" rx="1" fill="#fff" fill-opacity=".45"/><rect x="${x + 8}" y="${y + 19.5}" width="11" height="2" rx="1" fill="#fff" fill-opacity=".3"/>`;
            s += `<circle cx="${x + 23}" cy="${y + 10}" r="3.2" fill="${ART.led}" filter="url(#glow)" opacity=".7"/><circle cx="${x + 23}" cy="${y + 10}" r="2" fill="${ART.led}"/>`;
          });
        }
        svg.innerHTML =
          s +
          '<g id="dynLayer"></g><g id="regionLayer"></g><g id="exploredLayer"></g><g id="labelLayer"></g><g id="pathLayer"></g><g id="traveledLayer"></g><g id="markerLayer"></g><g id="robotLayer"></g><g id="hoverLayer"></g><g id="coordLayer"></g>';
        state.pathSig = '';
        state.markerSig = '';
        state.traveledLen = -1;
        renderLabels();
        renderCoords();
        build3D();
      }
      function renderLabels() {
        const m = state.map;
        let s = '';
        m.locations.forEach((l) => {
          const c = CATEGORY[l.category].color,
            ax = (l.anchor.x + 0.5) * CELL,
            ay = (l.anchor.y + 0.5) * CELL;
          s += `<circle cx="${ax}" cy="${ay}" r="5.5" fill="${ART.anchorFill}" stroke="${c}" stroke-width="2.4" filter="url(#soft)"/><circle cx="${ax}" cy="${ay}" r="1.8" fill="${c}"/>`;
          const a = l.area || { x: l.anchor.x, y: l.anchor.y, w: 1, h: 1 };
          const w = labelWidth(l.name),
            cx = (a.x + a.w / 2) * CELL,
            ty = Math.max(a.y * CELL + 2, 13);
          s += `<g transform="translate(${cx - w / 2} ${ty - 13})" style="pointer-events:none"><rect width="${w}" height="22" rx="${ART.labelRx}" fill="${ART.labelBg}" fill-opacity=".94" filter="url(#soft)"/><rect width="${w}" height="22" rx="${ART.labelRx}" fill="none" stroke="${ART.labelStroke}"/><circle cx="12" cy="11" r="4" fill="${c}"/><text x="21" y="15" font-size="11.5" font-weight="600" fill="${ART.labelText}" font-family="${ART.font.replace(/"/g, "'")}" letter-spacing="-.2">${esc(l.name)}</text></g>`;
        });
        $('labelLayer').innerHTML = s;
      }
      function renderCoords() {
        const m = state.map;
        let s = '';
        if (state.showCoords) {
          const font = `font-size="9.5" fill="#a1a1a6" font-family="'SF Mono',Menlo,Consolas,monospace"`;
          for (let x = 0; x < m.width; x++)
            s += `<text x="${(x + 0.5) * CELL}" y="-12" text-anchor="middle" ${font}>${x}</text>`;
          for (let y = 0; y < m.height; y++)
            s += `<text x="-12" y="${(y + 0.5) * CELL + 3}" text-anchor="end" ${font}>${y}</text>`;
        }
        $('coordLayer').innerHTML = s;
      }

      /* ---------- 动态层：用户修改 / 通道 / 区域 / 搜索 ---------- */
      function lockIcon(cx, cy) {
        return `<g transform="translate(${cx - 5} ${cy - 6})" style="pointer-events:none"><rect x="0" y="5" width="10" height="7.5" rx="2" fill="#fff"/><path d="M2.2 5.2V3.6a2.8 2.8 0 0 1 5.6 0v1.6" fill="none" stroke="#fff" stroke-width="1.6"/></g>`;
      }
      function renderDynamic() {
        const m = state.map;
        let s = '';
        const dyn = [...state.blocked].map(parseKey);
        if (dyn.length) {
          const d = rectPath(dyn, 4, 5);
          s += `<path d="${d}" fill="${ART.dynSide}" transform="translate(0 3)"/><path d="${d}" fill="url(#hatch)"/><path d="${d}" fill="none" stroke="${ART.dyn}" stroke-width="1.2"/>`;
        }
        [...state.cleared].map(parseKey).forEach((c) => {
          s += `<rect x="${c.x * CELL + 4}" y="${c.y * CELL + 4}" width="${CELL - 8}" height="${CELL - 8}" rx="6" fill="rgba(48,209,88,.1)" stroke="${ART.cleared}" stroke-width="1.2" stroke-dasharray="3 3"/>`;
        });
        m.passages.forEach((p) => {
          const closed = state.closed.has(p.id);
          if (closed) {
            const d = rectPath(p.cells, 3, 6);
            s += `<path d="${d}" fill="#b3261e" transform="translate(0 2.5)"/><path d="${d}" fill="url(#barrier)"/><path d="${d}" fill="none" stroke="${ART.passageClosed}" stroke-width="1.2"/>`;
            p.cells.slice(0, 2).forEach((c) => {
              s += `<circle cx="${(c.x + 0.5) * CELL}" cy="${(c.y + 0.5) * CELL}" r="8" fill="${ART.passageClosed}"/>${lockIcon((c.x + 0.5) * CELL, (c.y + 0.5) * CELL)}`;
            });
          } else
            s += `<path d="${rectPath(p.cells, 4, 7)}" fill="rgba(0,113,227,.05)" stroke="${ART.passageOpen}" stroke-width="1.2" stroke-dasharray="3 3"/>`;
        });
        $('dynLayer').innerHTML = s;
        update3DObstacles();
        // 不可达区域
        s = '';
        const err = state.trace && state.trace.error;
        const blockedErr = state.sim && state.sim.getSnapshot().blockedBy;
        const ue =
          (blockedErr && blockedErr.code === 'UNREACHABLE' ? blockedErr : null) ||
          (err && err.code === 'UNREACHABLE' ? err : null);
        if (ue) {
          if (ue.details.startRegion)
            s += `<path class="fade-in" d="${rectPath(ue.details.startRegion.map(parseKey), 2, 4)}" fill="${ART.regionStart}"/>`;
          if (ue.details.goalRegion)
            s += `<path class="fade-in" d="${rectPath(ue.details.goalRegion.map(parseKey), 2, 4)}" fill="${ART.regionGoal}"/>`;
        }
        $('regionLayer').innerHTML = s;
        set3D('f3region', s);
        // 搜索区域
        s = '';
        const planData =
          state.trace && state.trace.stages.plan.status === 'ok' ? state.trace.stages.plan.data : null;
        if (state.showExplored && planData)
          planData.segments.forEach((seg) => {
            s += `<path class="fade-in" d="${rectPath(seg.explored, 6, 5)}" fill="${ART.explored}"/>`;
          });
        $('exploredLayer').innerHTML = s;
        set3D('f3explored', s);
        renderPath();
      }

      /* ---------- 路线：只在规划变化时重绘，逐格只更新“已走轨迹” ---------- */
      const pts = (cells) => cells.map((c) => `${(c.x + 0.5) * CELL},${(c.y + 0.5) * CELL}`).join(' ');
      function renderPath() {
        const snap = state.sim ? state.sim.getSnapshot() : null;
        const sig = snap ? `${snap.path.map(key).join(';')}|${snap.waypointIndices.join(',')}` : '';
        const svg = $('map');
        svg.dataset.path = snap ? snap.path.map(key).join(';') : '';
        svg.dataset.steps = snap ? String(snap.path.length - 1) : '';
        if (sig !== state.pathSig) {
          state.pathSig = sig;
          let s = '';
          if (snap) {
            let from = 0;
            snap.waypointIndices.forEach((wi, i) => {
              const cells = snap.path.slice(from, wi + 1);
              from = wi;
              if (cells.length < 2) return;
              const col = SEGMENT_COLORS[i % SEGMENT_COLORS.length],
                len = (cells.length - 1) * CELL + 2,
                p = pts(cells);
              s += `<g><polyline points="${p}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".12"/>`;
              s += `<polyline points="${p}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".92" style="stroke-dasharray:${len};animation:drawIn .9s cubic-bezier(.25,.1,.25,1) both;--len:${len}"/></g>`;
              s += `<polyline points="${p}" fill="none" stroke="${ART.flow}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.01 18" class="path-flow" opacity=".75"/>`;
            });
          }
          $('pathLayer').innerHTML = s;
          set3D('f3path', s);
          state.traveledLen = -1;
          state.markerSig = '';
        }
        renderTraveled(snap);
        renderMarkers(snap);
      }
      function renderTraveled(snap) {
        const len = snap ? snap.traveled.length : 0;
        if (len === state.traveledLen) return;
        state.traveledLen = len;
        const html =
          snap && len > 1
            ? `<polyline points="${pts(snap.traveled)}" fill="none" stroke="${ART.traveled}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>`
            : '';
        $('traveledLayer').innerHTML = html;
        set3D('f3traveled', html);
      }
      function renderMarkers(snap) {
        const sig = snap ? `${state.pathSig}#${snap.nextWaypoint}` : '';
        if (sig === state.markerSig) return;
        state.markerSig = sig;
        let s = '';
        if (snap) {
          const st = snap.path[0];
          s += `<g transform="translate(${(st.x + 0.5) * CELL} ${(st.y + 0.5) * CELL})" filter="url(#soft)"><circle r="9.5" fill="#fff"/><circle r="9.5" fill="none" stroke="#30d158" stroke-width="2"/><text y="3.8" font-size="10" font-weight="700" text-anchor="middle" fill="#248a3d" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">起</text></g>`;
          snap.waypointIndices.forEach((wi, i) => {
            const c = snap.path[wi];
            if (!c) return;
            const col = SEGMENT_COLORS[i % SEGMENT_COLORS.length];
            const lbl = snap.waypointIndices.length === 1 ? '终' : String(i + 1),
              done = i < snap.nextWaypoint;
            s += `<g transform="translate(${(c.x + 0.5) * CELL} ${(c.y + 0.5) * CELL - 15})" filter="url(#soft)" opacity="${done ? 0.5 : 1}"><path d="M0 13 C-2 9 -9 6 -9 -1 A9 9 0 1 1 9 -1 C9 6 2 9 0 13 Z" fill="${col}"/><circle r="6" fill="#fff" fill-opacity=".22"/><text y="3.6" font-size="10" font-weight="700" text-anchor="middle" fill="#fff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">${done ? '✓' : lbl}</text></g>`;
          });
        }
        $('markerLayer').innerHTML = s;
        render3DMarkers(snap);
      }

      /* ---------- 机器人（每帧命令式更新 transform） ---------- */
      function ensureRobot() {
        const layer = $('robotLayer');
        if (!state.robot && !state.sim) {
          layer.innerHTML = '';
          return null;
        }
        let g = $('robot');
        if (!g) {
          layer.innerHTML = `<g id="robot" data-testid="robot" style="color:#0071e3">
      <ellipse cx="0" cy="12" rx="11" ry="3.6" fill="rgba(0,0,0,.22)" filter="url(#blur3)"/>
      <circle class="robot-halo" r="14" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <g id="robotBody">
        <circle r="12" fill="url(#gRobot)"/>
        <circle r="12" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="1"/>
        <circle r="8.6" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".9"/>
        <path d="M6.2 -4.2 L11.4 0 L6.2 4.2 Z" fill="currentColor"/>
        <circle cx="-1.5" cy="0" r="3.4" fill="#1d1d1f"/>
        <circle cx="-0.4" cy="-1.1" r="1" fill="#fff" opacity=".9"/>
      </g></g>`;
          g = $('robot');
        }
        return g;
      }
      function drawRobot() {
        const g = ensureRobot();
        if (!g) {
          draw3DRobot(null);
          return;
        }
        let pose,
          status = 'idle',
          cellK;
        if (state.sim) {
          const snap = state.sim.getSnapshot();
          pose = snap.pose;
          status = snap.status;
          cellK = key(snap.currentCell);
        } else {
          pose = { x: state.robot.x, y: state.robot.y, headingDeg: state.heading };
          cellK = key(state.robot);
        }
        const diff = ((pose.headingDeg - state.heading + 540) % 360) - 180;
        state.heading = Math.abs(diff) < 0.5 ? pose.headingDeg : (state.heading + diff * 0.2 + 360) % 360;
        g.setAttribute('transform', `translate(${(pose.x + 0.5) * CELL} ${(pose.y + 0.5) * CELL})`);
        $('robotBody').setAttribute('transform', `rotate(${state.heading})`);
        if (g.dataset.status !== status) {
          g.style.color = STATUS_COLOR[status] || STATUS_COLOR.idle;
          g.querySelector('.robot-halo').style.display = status === 'running' ? '' : 'none';
          g.dataset.status = status;
        }
        g.dataset.cell = cellK;
        draw3DRobot(pose, status, cellK, state.heading);
      }

      /* ---------- 流水线面板 ---------- */
      const STATUS_LABEL = { ok: '成功', error: '失败', skipped: '未执行', running: '进行中' };
      const MATCH_LABEL = {
        exact: '精确',
        alias: '别名',
        category: '类别词',
        nearest: '最近',
        fuzzy: '模糊',
        clarified: '已澄清',
        deictic: '指代',
        robot: '机器人位置',
      };
      function stageCard(n, title, stage, body, testid) {
        const st = stage.status;
        return `<div class="stage ${st}" data-testid="${testid}" data-status="${st}"><div class="stage-h"><span class="n">${n}</span><span class="grow">${title}</span>${stage.durationMs !== undefined ? `<span class="ms">${stage.durationMs.toFixed(2)} ms</span>` : ''}<span class="pill ${st}">${STATUS_LABEL[st]}</span></div><div class="stage-b">${body}</div></div>`;
      }
      function errorBlock(e) {
        const msg = describeError(e);
        return `<div class="err-title">${esc(msg.title)} <span class="tag">${esc(e.code)}</span></div><div class="err-detail">${esc(msg.detail)}</div>`;
      }
      function highlight(norm, cmd) {
        const marks = [
          ...(cmd.start && cmd.start.span ? [{ ...cmd.start, cls: 'start' }] : []),
          ...cmd.goals.filter((g) => g.span).map((g) => ({ ...g, cls: 'goal' })),
        ].sort((a, b) => a.span[0] - b.span[0]);
        let out = '',
          i = 0;
        marks.forEach((m) => {
          if (m.span[0] < i) return;
          out +=
            esc(norm.slice(i, m.span[0])) +
            `<mark class="${m.cls}">${esc(norm.slice(m.span[0], m.span[1]))}</mark>`;
          i = m.span[1];
        });
        return out + esc(norm.slice(i));
      }
      function renderInspector() {
        const tr = state.trace;
        if (!tr) {
          $('banner').innerHTML =
            `<div class="banner info"><span class="ic">${ICONS.question}</span><div><div class="t">准备就绪</div><div class="d">输入指令或点击左侧预设。四个阶段的结果会分别显示，方便定位问题出在哪一环。</div></div></div>`;
          $('stages').innerHTML = ['指令解析', '地点映射', '路径规划', '移动执行']
            .map((t, i) =>
              stageCard(i + 1, t, { status: 'skipped' }, '<span class="empty">等待指令</span>', `stage-${i}`),
            )
            .join('');
          return;
        }
        const tone = tr.outcome === 'success' ? 'success' : tr.outcome;
        const icon =
          tr.outcome === 'success'
            ? ICONS.check
            : tr.outcome === 'clarification'
              ? ICONS.question
              : ICONS.alert;
        let ban = `<div class="banner ${tone}" data-testid="outcome-banner" data-outcome="${tr.outcome}"><span class="ic">${icon}</span><div style="flex:1;min-width:0">`;
        if (tr.error) {
          const msg = describeError(tr.error);
          ban += `<div class="t">${esc(msg.title)}</div><div class="d">${esc(msg.detail)}</div>`;
        } else ban += `<div class="t">规划成功</div><div class="d">${esc(tr.summary)}</div>`;
        if (tr.suggestions.length) {
          ban +=
            `<div class="chips">` +
            tr.suggestions
              .map((sg, i) => {
                const label =
                  sg.kind === 'chooseLocation'
                    ? sg.label
                    : sg.kind === 'openPassage'
                      ? `打开「${sg.label}」并重试`
                      : sg.kind === 'placeRobot'
                        ? `把机器人放在「${sg.label}」`
                        : `“${sg.example}”`;
                return `<button class="chip" data-suggest="${i}" data-testid="suggestion-${i}" data-kind="${sg.kind}">${esc(label)}</button>`;
              })
              .join('') +
            `</div>`;
        }
        $('banner').innerHTML = ban + '</div></div>';
        const P = tr.stages.parse;
        let body;
        if (P.status === 'ok') {
          const c = P.data;
          body = `<div class="kv"><span class="k">句式</span><span><span class="tag" data-testid="parse-pattern">${c.pattern}</span> ${PATTERN_LABELS[c.pattern]}</span></div><div class="norm">${highlight(c.normalized, c)}</div>
      <div class="kv"><span class="k">起点</span><span>${c.start ? esc(c.start.text) + (c.start.deictic ? ' <span class="tag">指代</span>' : '') : '<span class="hint">未说明 · 使用机器人当前位置</span>'}</span>
      <span class="k">目标</span><span>${c.goals.map((g, i) => `${i + 1}. ${esc(g.text)}${g.modifier ? ' <span class="tag nearest">最近的</span>' : ''}${g.deictic ? ' <span class="tag">指代</span>' : ''}${g.lexical === 'unknown' ? ' <span class="tag">词表外</span>' : ''}`).join('<br>')}</span></div>
      <details style="margin-top:8px"><summary class="hint">分词详情（${c.tokens.length}）</summary><div class="tokens">${c.tokens.map((t) => `<span class="tok"><b>${t.type}</b>${esc(t.text)}</span>`).join('')}</div></details>
      ${c.notes.length ? `<ul class="notes">${c.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}`;
        } else body = P.status === 'error' ? errorBlock(P.error) : '<span class="empty">未执行</span>';
        let html = stageCard(1, '指令解析', P, body, 'stage-parse');
        const G = tr.stages.ground;
        if (G.status === 'ok') {
          const d = G.data,
            rows = [['起点', d.start], ...d.goals.map((g, i) => [`目标 ${i + 1}`, g])];
          body = `<table class="g"><tr><th>角色</th><th>原文</th><th>地点</th><th>停靠格</th><th>方式</th></tr>${rows.map(([r, p], i) => `<tr data-testid="ground-row-${i}" data-location-id="${p.locationId ?? ''}" data-match-type="${p.matchType}"><td>${r}</td><td>${esc(p.mentionText ?? '—')}</td><td><b>${esc(p.label)}</b></td><td class="mono">${fmt(p.cell)}</td><td><span class="tag ${p.matchType}">${MATCH_LABEL[p.matchType]}${p.confidence < 1 ? ' ' + p.confidence : ''}</span></td></tr>`).join('')}</table>
      ${d.notes.length ? `<ul class="notes">${d.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}`;
        } else body = G.status === 'error' ? errorBlock(G.error) : '<span class="empty">未执行</span>';
        html += stageCard(2, '地点映射', G, body, 'stage-ground');
        const L = tr.stages.plan;
        if (L.status === 'ok') {
          const d = L.data;
          body = `<div class="kv"><span class="k">总步数</span><span><b data-testid="plan-total-steps">${d.totalSteps}</b> 步 · 拐弯 ${d.totalTurns} 次 · 扩展 ${d.expandedNodes} 个节点</span></div>
      <table class="g" style="margin-top:6px"><tr><th>段</th><th>起 → 止</th><th>步数</th><th>拐弯</th></tr>${d.segments.map((sg, i) => `<tr><td><span class="seg-sw" style="background:${SEGMENT_COLORS[i % SEGMENT_COLORS.length]}"></span>${i + 1}</td><td class="mono">${fmt(sg.from)} → ${fmt(sg.to)}</td><td>${sg.steps}</td><td>${sg.turns}</td></tr>`).join('')}</table>
      ${d.notes.length ? `<ul class="notes">${d.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}`;
        } else
          body =
            L.status === 'error'
              ? errorBlock(L.error) +
                (L.error.code === 'UNREACHABLE'
                  ? '<div class="hint" style="margin-top:6px">地图上蓝色为起点可达区域，粉色为目标所在区域。</div>'
                  : '')
              : '<span class="empty">未执行</span>';
        html += stageCard(3, '路径规划', L, body, 'stage-plan');
        html += `<div id="execCard"></div>`;
        $('stages').innerHTML = html;
        renderExec();
      }
      const SIM_LABEL = {
        ready: '就绪',
        running: '移动中',
        dwelling: '到达途经点',
        paused: '已暂停',
        arrived: '已到达',
        blocked: '被阻断',
      };
      function renderExec() {
        const el = $('execCard');
        $('playBtn').innerHTML =
          state.sim && ['running', 'dwelling'].includes(state.sim.getSnapshot().status)
            ? ICONS.pause
            : ICONS.play;
        if (!el) return;
        if (!state.sim) {
          el.innerHTML = stageCard(
            4,
            '移动执行',
            { status: 'skipped' },
            '<span class="empty">规划成功后自动播放</span>',
            'stage-exec',
          );
          $('retryBtn').style.display = 'none';
          return;
        }
        const s = state.sim.getSnapshot();
        const st = s.status === 'blocked' ? 'error' : s.status === 'arrived' ? 'ok' : 'running';
        let body = `<div class="kv"><span class="k">状态</span><span><b>${SIM_LABEL[s.status]}</b></span><span class="k">当前格</span><span class="mono">${fmt(s.currentCell)}</span>
    <span class="k">进度</span><span>${Math.round(s.progress * 100)}% · 已走 ${s.traveled.length - 1} 步 · 途经点 ${Math.min(s.nextWaypoint, s.waypointIndices.length)}/${s.waypointIndices.length}</span>
    <span class="k">重规划</span><span>${s.replanCount} 次</span></div>`;
        if (s.blockedBy) body += `<div style="margin-top:8px">${errorBlock(s.blockedBy)}</div>`;
        el.innerHTML = stageCard(4, '移动执行', { status: st }, body, 'stage-exec');
        $('progressBar').style.width = `${s.progress * 100}%`;
        $('retryBtn').style.display = s.status === 'blocked' ? '' : 'none';
      }
      const EVENT_DOT = {
        started: 'clarification',
        waypointReached: 'clarification',
        arrived: 'success',
        replanned: 'failed',
        blocked: 'unreachable',
      };
      function renderLog() {
        $('log').innerHTML = state.events.length
          ? state.events
              .slice(-60)
              .reverse()
              .map(
                (e) =>
                  `<div class="log-item" data-event-type="${e.type}"><span class="time">${(e.atMs / 1000).toFixed(1)}s</span><span class="dot ${EVENT_DOT[e.type]}" style="${e.type === 'replanned' ? 'background:#ff9f0a' : ''}"></span><span>${e.text}</span></div>`,
              )
              .join('')
          : '<div class="hint">暂无事件</div>';
      }
      function logEvents(events) {
        const labels = state.simGoals;
        let logged = false,
          pathChanged = false,
          needsExec = false;
        for (const e of events) {
          let text = null;
          if (e.type === 'started') text = '开始移动';
          else if (e.type === 'waypointReached')
            text = `到达第 ${e.waypoint + 1} 个目标「${esc(labels[e.waypoint] || '')}」${fmt(e.cell)}`;
          else if (e.type === 'arrived') {
            text = '已到达终点';
            toast('已到达终点');
          } else if (e.type === 'replanned') {
            text = `检测到障碍，从 ${fmt(e.from)} 重新规划（路程 ${e.deltaSteps >= 0 ? '+' : ''}${e.deltaSteps} 步）`;
            toast('前方出现障碍，已重新规划');
            pathChanged = true;
          } else if (e.type === 'blocked') {
            text = `${esc(describeError(e.error).title)}：机器人停在 ${fmt(e.cell)}`;
            toast('无路可走，机器人已停下');
            pathChanged = true;
          }
          if (text) {
            state.events.push({ atMs: e.atMs, text, type: e.type });
            logged = true;
          }
          needsExec = true;
        }
        if (logged) renderLog();
        if (pathChanged) renderDynamic();
        else if (events.length && state.sim) {
          const snap = state.sim.getSnapshot();
          renderTraveled(snap);
          renderMarkers(snap);
        }
        if (needsExec) renderExec();
      }

      /* =====================================================================
       * 10. 交互
       * ===================================================================== */
      function runCommand(text, { keepClarifications = false } = {}) {
        if (!keepClarifications) state.clarifications = {};
        if (state.sim) stopSim();
        state.lastText = text;
        if (text.trim() && state.history[state.history.length - 1] !== text) state.history.push(text);
        state.historyIdx = -1;
        const req = {
          mapId: state.map.id,
          text,
          robotCell: state.robot ? { ...state.robot } : null,
          overrides: overrides(),
          clarifications: { ...state.clarifications },
          options: { parser: 'rule', startPolicy: 'teleport' },
        };
        const tr = navigate(req);
        state.trace = tr;
        state.events = [];
        if (tr.outcome === 'success') {
          const g = tr.stages.ground.data,
            plan = tr.stages.plan.data;
          if (g.startSource === 'command' && (!state.robot || !eq(state.robot, g.start.cell)))
            toast(`机器人已就位：${g.start.label}`);
          state.robot = { ...g.start.cell };
          state.simGoals = g.goals.map((x) => x.label);
          state.sim = createSimulator({
            grid: currentGrid(),
            plan,
            goals: g.goals.map((x) => x.cell),
            speed: state.speed,
          });
          state.heading = state.sim.getSnapshot().pose.headingDeg;
          state.pathSig = '';
          logEvents(state.sim.start());
        } else {
          state.sim = null;
        }
        renderInspector();
        renderDynamic();
        renderLog();
        drawRobot();
        window.__lastTrace = tr;
        return tr;
      }
      function applySuggestion(sg) {
        if (sg.kind === 'chooseLocation') {
          state.clarifications[sg.mentionText] = sg.locationId;
          runCommand(state.lastText, { keepClarifications: true });
        } else if (sg.kind === 'openPassage') {
          state.closed.delete(sg.passageId);
          renderSidebar();
          runCommand(state.lastText, { keepClarifications: true });
        } else if (sg.kind === 'placeRobot') {
          state.robot = { ...state.map.locations.find((l) => l.id === sg.locationId).anchor };
          runCommand(state.lastText, { keepClarifications: true });
        } else if (sg.kind === 'rephrase') {
          $('cmd').value = sg.example;
          updateCounter();
          runCommand(sg.example);
        }
      }
      function onGridChanged() {
        renderSidebar();
        renderDynamic();
        if (state.sim) logEvents(state.sim.updateGrid(currentGrid()));
      }
      function simBusy() {
        const st = state.sim && state.sim.getSnapshot().status;
        return st === 'running' || st === 'dwelling' || st === 'paused';
      }
      function updateCounter() {
        $('counter').textContent = `${[...$('cmd').value].length}/100`;
      }

      function cellFromEvent(ev) {
        const svg = $('map');
        const ctm = svg.getScreenCTM();
        if (!ctm) return null;
        const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(ctm.inverse());
        const c = { x: Math.floor(p.x / CELL), y: Math.floor(p.y / CELL) };
        return c.x >= 0 && c.y >= 0 && c.x < state.map.width && c.y < state.map.height ? c : null;
      }
      function toggleObstacle(c, action) {
        const m = state.map,
          k = key(c);
        if (state.sim && state.sim.isCellLocked(c) && simBusy()) {
          toast('机器人所在或即将进入的格子不能放置障碍');
          return false;
        }
        if (!state.sim && state.robot && eq(state.robot, c)) {
          toast('不能在机器人所在格放置障碍');
          return false;
        }
        const base = terrainAt(m, c) !== 'floor';
        if (base) {
          const want = action ?? (state.cleared.has(k) ? 'add' : 'remove');
          if (want === 'remove') state.cleared.add(k);
          else state.cleared.delete(k);
          return want;
        }
        const want = action ?? (state.blocked.has(k) ? 'remove' : 'add');
        if (want === 'add') state.blocked.add(k);
        else state.blocked.delete(k);
        return want;
      }
      function onMapPointerDown(ev) {
        const c = cellFromEvent(ev);
        if (!c) return;
        handleCellDown(c, () => $('map').setPointerCapture(ev.pointerId));
      }
      /* 二维与三维共用的格子点击逻辑；capture 为二维拖动绘制时的指针捕获回调 */
      function handleCellDown(c, capture) {
        if (state.mode === 'place') {
          if (simBusy()) {
            toast('运行中不能移动机器人');
            return;
          }
          if (currentGrid().isBlocked(c)) {
            toast('不能把机器人放在障碍上');
            return;
          }
          state.sim = null;
          state.robot = c;
          state.trace = null;
          renderInspector();
          renderDynamic();
          drawRobot();
          toast(`机器人已放置在 ${fmt(c)}`);
          return;
        }
        if (state.mode === 'edit') {
          const p = state.map.passages.find((pp) => pp.cells.some((pc) => eq(pc, c)));
          if (p) {
            if (state.closed.has(p.id)) state.closed.delete(p.id);
            else state.closed.add(p.id);
            onGridChanged();
            return;
          }
          const action = toggleObstacle(c, null);
          if (action) {
            state.painting = action;
            if (capture) capture();
            onGridChanged();
          }
          return;
        }
        const l = state.map.locations.find((x) => (x.area ? rectHas(x.area, c) : eq(x.anchor, c)));
        if (l) {
          $('cmd').value = `去${l.name}`;
          updateCounter();
          $('cmd').focus();
        }
      }
      /* 编辑模式拖动时，对经过的格子执行与按下时相同的动作（跳过通道格） */
      function paintCell(c) {
        if (!state.painting || state.mode !== 'edit') return;
        if (state.map.passages.some((p) => p.cells.some((pc) => eq(pc, c)))) return;
        const k = key(c);
        const already =
          terrainAt(state.map, c) !== 'floor'
            ? (state.painting === 'remove') === state.cleared.has(k)
            : (state.painting === 'add') === state.blocked.has(k);
        if (!already && toggleObstacle(c, state.painting)) onGridChanged();
      }
      function cellInfo(c) {
        const g = currentGrid();
        const loc = state.map.locations.find((x) => (x.area ? rectHas(x.area, c) : eq(x.anchor, c)));
        const pass = state.map.passages.find((p) => p.cells.some((pc) => eq(pc, c)));
        const terr = { floor: '地面', wall: '墙体', table: '桌台', shelf: '货架', machine: '设备' }[
          terrainAt(state.map, c)
        ];
        return `${fmt(c)} · ${g.isBlocked(c) ? '不可通行' : '可通行'} · ${state.blocked.has(key(c)) ? '临时障碍' : terr}${loc ? ' · ' + loc.name + (eq(loc.anchor, c) ? '（停靠点）' : '') : ''}${pass ? ' · ' + pass.name + (state.closed.has(pass.id) ? '（封闭）' : '') : ''}`;
      }
      function onMapPointerMove(ev) {
        const c = cellFromEvent(ev);
        const tip = $('tooltip');
        if (!c) {
          tip.style.display = 'none';
          $('hoverLayer').innerHTML = '';
          return;
        }
        paintCell(c);
        if ($('hoverLayer').dataset.cell !== key(c)) {
          $('hoverLayer').dataset.cell = key(c);
          $('hoverLayer').innerHTML =
            `<rect x="${c.x * CELL + 1.5}" y="${c.y * CELL + 1.5}" width="${CELL - 3}" height="${CELL - 3}" rx="7" fill="rgba(0,113,227,.06)" stroke="#0071e3" stroke-opacity=".55" stroke-width="1.5"/>`;
        }
        tip.textContent = cellInfo(c);
        const wrap = $('mapWrap').getBoundingClientRect();
        tip.style.left = `${ev.clientX - wrap.left}px`;
        tip.style.top = `${ev.clientY - wrap.top}px`;
        tip.style.display = 'block';
      }

      function frame(ts) {
        const dt = state.lastFrame ? Math.min(100, ts - state.lastFrame) : 0;
        state.lastFrame = ts;
        if (state.sim) {
          const ev = state.sim.advance(dt);
          if (ev.length) logEvents(ev);
        }
        drawRobot();
        if (state.sim && ts - (frame.last || 0) > 120) {
          frame.last = ts;
          $('progressBar').style.width = `${state.sim.getSnapshot().progress * 100}%`;
        }
        requestAnimationFrame(frame);
      }

      function setupVoice() {
        const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
        const btn = $('voiceBtn');
        btn.innerHTML = ICONS.mic;
        if (!Ctor) {
          btn.disabled = true;
          btn.title = '当前浏览器不支持语音识别（请使用 Chrome 或 Edge）';
          return;
        }
        let rec = null;
        btn.addEventListener('click', () => {
          if (rec) {
            rec.stop();
            return;
          }
          rec = new Ctor();
          rec.lang = 'zh-CN';
          rec.interimResults = true;
          rec.continuous = false;
          btn.classList.add('listening');
          $('voiceHint').textContent = '正在聆听…';
          rec.onresult = (e) => {
            let text = '';
            for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
            $('cmd').value = text;
            updateCounter();
            if (e.results[e.results.length - 1].isFinal) {
              rec.stop();
              runCommand(text);
            }
          };
          rec.onerror = (e) => {
            toast(
              {
                'not-allowed': '麦克风权限被拒绝',
                network: '语音服务不可用（国内网络建议使用 Edge）',
                'no-speech': '没有听到声音',
              }[e.error] || `语音识别出错：${e.error}`,
            );
          };
          rec.onend = () => {
            btn.classList.remove('listening');
            $('voiceHint').textContent = '回车执行 · ↑↓ 历史';
            rec = null;
          };
          rec.start();
        });
      }
      function moveSegThumb() {
        const active = $('modeSeg').querySelector('button.active'),
          thumb = $('segThumb');
        thumb.style.width = `${active.offsetWidth}px`;
        thumb.style.transform = `translateX(${active.offsetLeft - 2}px)`;
      }

      function init() {
        const params0 = new URLSearchParams(location.search);
        $('mapSelect').innerHTML = MAPS.map(
          (m) => `<option value="${m.id}">${m.name} · ${m.width}×${m.height}</option>`,
        ).join('');
        $('mapSelect').addEventListener('change', (e) => selectMap(e.target.value));
        $('themeSelect').innerHTML = Object.entries(THEMES)
          .map(([id, t]) => `<option value="${id}">${t.label}</option>`)
          .join('');
        $('themeSelect').addEventListener('change', (e) => applyTheme(e.target.value, true));
        $('randomMapBtn').innerHTML = ICONS.dice;
        $('randomMapBtn').addEventListener('click', () => loadRandomMap());
        let savedTheme = params0.get('theme');
        if (!savedTheme) {
          try {
            savedTheme = localStorage.getItem('nlnav-theme');
          } catch {
            savedTheme = null;
          }
        }
        applyTheme(THEMES[savedTheme] ? savedTheme : 'apple', false);
        $('runBtn').addEventListener('click', () => runCommand($('cmd').value));
        $('cmd').addEventListener('input', updateCounter);
        $('cmd').addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            runCommand($('cmd').value);
          }
          if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && state.history.length) {
            e.preventDefault();
            const n = state.history.length;
            state.historyIdx =
              e.key === 'ArrowUp'
                ? state.historyIdx <= 0
                  ? n - 1
                  : state.historyIdx - 1
                : (state.historyIdx + 1) % n;
            $('cmd').value = state.history[state.historyIdx];
            updateCounter();
          }
        });
        document.body.addEventListener('click', (e) => {
          const t = e.target.closest('[data-preset],[data-passage],[data-goto],[data-place],[data-suggest]');
          if (!t) return;
          if (t.dataset.preset !== undefined) {
            const p = state.map.presets[+t.dataset.preset];
            state.sim = null;
            state.blocked.clear();
            state.cleared.clear();
            state.closed = new Set(p.setup.closedPassages ?? resolveClosed(state.map));
            state.robot = {
              ...state.map.locations.find((l) => l.id === (p.setup.robotAt || state.map.defaultStart)).anchor,
            };
            renderSidebar();
            renderDynamic();
            $('cmd').value = p.text;
            updateCounter();
            runCommand(p.text);
          } else if (t.dataset.passage) {
            const id = t.dataset.passage;
            if (state.closed.has(id)) state.closed.delete(id);
            else state.closed.add(id);
            onGridChanged();
          } else if (t.dataset.goto) {
            const l = state.map.locations.find((x) => x.id === t.dataset.goto);
            $('cmd').value = `去${l.name}`;
            updateCounter();
            runCommand(`去${l.name}`);
          } else if (t.dataset.place) {
            if (simBusy()) {
              toast('运行中不能移动机器人');
              return;
            }
            state.sim = null;
            state.trace = null;
            state.robot = { ...state.map.locations.find((x) => x.id === t.dataset.place).anchor };
            renderInspector();
            renderDynamic();
            drawRobot();
          } else if (t.dataset.suggest !== undefined)
            applySuggestion(state.trace.suggestions[+t.dataset.suggest]);
        });
        $('modeSeg').addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          state.mode = b.dataset.mode;
          [...$('modeSeg').querySelectorAll('button')].forEach((x) => x.classList.toggle('active', x === b));
          $('map').setAttribute('class', `map mode-${state.mode}`);
          $('stage3d').className = `stage3d mode-${state.mode}`;
          moveSegThumb();
        });
        $('viewSeg').addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (b && b.dataset.view !== state.view) setView(b.dataset.view);
        });
        setup3D();
        window.addEventListener('resize', moveSegThumb);
        const svg = $('map');
        svg.addEventListener('pointerdown', onMapPointerDown);
        svg.addEventListener('pointermove', onMapPointerMove);
        svg.addEventListener('pointerup', () => {
          state.painting = null;
        });
        svg.addEventListener('pointerleave', () => {
          $('tooltip').style.display = 'none';
          $('hoverLayer').innerHTML = '';
          $('hoverLayer').dataset.cell = '';
        });
        $('showExplored').addEventListener('change', (e) => {
          state.showExplored = e.target.checked;
          renderDynamic();
        });
        $('showCoords').addEventListener('change', (e) => {
          state.showCoords = e.target.checked;
          renderCoords();
        });
        $('clearObs').addEventListener('click', () => {
          state.blocked.clear();
          state.cleared.clear();
          onGridChanged();
        });
        $('removeRobot').addEventListener('click', () => {
          if (simBusy()) {
            toast('运行中不能移除机器人');
            return;
          }
          state.sim = null;
          state.robot = null;
          state.trace = null;
          renderInspector();
          renderDynamic();
          drawRobot();
          toast('已移除机器人，可演示“未设置起点”的提示');
        });
        const togglePlay = () => {
          if (!state.sim) return;
          const st = state.sim.getSnapshot().status;
          if (st === 'running' || st === 'dwelling') logEvents(state.sim.pause());
          else if (st === 'paused') logEvents(state.sim.resume());
          else if (st === 'arrived' && state.lastText)
            runCommand(state.lastText, { keepClarifications: true });
          renderExec();
        };
        $('stepBtn').innerHTML = ICONS.step;
        $('resetBtn').innerHTML = ICONS.reset;
        $('playBtn').innerHTML = ICONS.play;
        $('playBtn').addEventListener('click', togglePlay);
        $('stepBtn').addEventListener('click', () => {
          if (!state.sim) return;
          const st = state.sim.getSnapshot().status;
          if (st === 'running') state.sim.pause();
          logEvents(state.sim.step());
          renderExec();
        });
        $('resetBtn').addEventListener('click', () => {
          if (state.lastText && state.trace && state.trace.outcome === 'success') {
            state.robot = { ...state.trace.stages.ground.data.start.cell };
            runCommand(state.lastText, { keepClarifications: true });
          }
        });
        $('retryBtn').addEventListener('click', () => {
          if (state.sim) logEvents(state.sim.retry());
        });
        $('speed').addEventListener('input', (e) => {
          state.speed = +e.target.value;
          $('speedLabel').textContent = `${state.speed.toFixed(1)} 格/秒`;
          if (state.sim) state.sim.setSpeed(state.speed);
        });
        $('copyBtn').addEventListener('click', async () => {
          const payload = JSON.stringify(
            {
              trace: state.trace,
              snapshot: state.sim ? state.sim.getSnapshot() : null,
              map: state.map.id,
              overrides: overrides(),
              robot: state.robot,
            },
            null,
            2,
          );
          try {
            await navigator.clipboard.writeText(payload);
            toast('调试信息已复制');
          } catch {
            console.log(payload);
            toast('无法访问剪贴板，已输出到控制台');
          }
        });
        document.addEventListener('keydown', (e) => {
          if (
            e.target.tagName === 'TEXTAREA' ||
            e.target.tagName === 'INPUT' ||
            e.target.tagName === 'SELECT'
          )
            return;
          if (e.key === ' ') {
            e.preventDefault();
            togglePlay();
          }
          if (e.key === '.') $('stepBtn').click();
          if (e.key === 'r' || e.key === 'R') $('resetBtn').click();
          if (e.key === '/') {
            e.preventDefault();
            $('cmd').focus();
          }
        });
        setupVoice();
        const params = new URLSearchParams(location.search);
        if (params.get('debug') === '1') {
          $('showCoords').checked = true;
          state.showCoords = true;
          $('showExplored').checked = true;
          state.showExplored = true;
        }
        if (params.get('seed')) loadRandomMap(Number(params.get('seed')) >>> 0);
        else
          selectMap(
            params.get('map') && MAPS.some((m) => m.id === params.get('map')) ? params.get('map') : MAPS[0].id,
          );
        let savedView = params.get('view');
        if (!savedView) {
          try {
            savedView = localStorage.getItem('nlnav-view');
          } catch {
            savedView = null;
          }
        }
        requestAnimationFrame(() => {
          moveSegThumb();
          setView(savedView === '3d' ? '3d' : '2d', false);
          requestAnimationFrame(frame);
        });
      }

      /* =====================================================================
       * 11. 三维视图：纯 CSS 3D（无第三方依赖），与二维共用同一份状态与仿真
       * ===================================================================== */
      const C3 = 34; // 三维中每格的像素边长
      const H3 = { wall: 46, table: 15, shelf: 38, machine: 26, dyn: 22, barrier: 18 };
      const INSET3 = { wall: 0, table: 3, shelf: 3, machine: 4, dyn: 4, barrier: 2 };
      const FACE3 = {
        wall: { top: 'linear-gradient(160deg,#6f7683,#586070)', s: '#4b515c', e: '#555c68', w: '#555c68', n: '#40454e' },
        table: { top: 'linear-gradient(160deg,#f0dbbf,#dcba94)', s: '#c49c73', e: '#cea880', w: '#cea880', n: '#b48e66' },
        shelf: {
          top: 'linear-gradient(160deg,#d9b790,#c29d75)',
          s: 'repeating-linear-gradient(180deg,#8d6a4a 0 2px,#b88f68 2px 12px)',
          e: '#a8825c',
          w: '#a8825c',
          n: '#8d6a4a',
        },
        machine: { top: 'linear-gradient(160deg,#b4bdca,#8d99ab)', s: '#6d788b', e: '#7a8598', w: '#7a8598', n: '#5d677a' },
        dyn: {
          top: 'repeating-linear-gradient(45deg,#ff9f0a 0 5px,#ffd08a 5px 10px)',
          s: '#e58e00',
          e: '#f29600',
          w: '#f29600',
          n: '#cc7f00',
        },
        barrier: {
          top: 'repeating-linear-gradient(-45deg,#ff3b30 0 6px,#ffffff 6px 12px)',
          s: 'repeating-linear-gradient(90deg,#ff3b30 0 6px,#ffffff 6px 12px)',
          e: '#e0352b',
          w: '#e0352b',
          n: '#c62f26',
        },
      };
      const CAM_DEFAULT = { yaw: -20, pitch: 56, zoom: 1 };
      const cam = { ...CAM_DEFAULT, fit: 1, drag: null };
      const v3 = { labels: [], markers: [], robot: null, body: null, hover: null, status: '' };
      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
      const set3D = (id, html) => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = html;
      };

      function setView(view, animate = true) {
        state.view = view;
        const is3d = view === '3d';
        $('mapWrap').style.display = is3d ? 'none' : '';
        $('stage3d').style.display = is3d ? '' : 'none';
        $('tooltip').style.display = 'none';
        $('tooltip3d').style.display = 'none';
        [...$('viewSeg').querySelectorAll('button')].forEach((b) => b.classList.toggle('active', b.dataset.view === view));
        $('viewSeg').dataset.view = view;
        const shown = is3d ? $('stage3d') : $('mapWrap');
        if (animate) {
          shown.classList.remove('view-fade');
          void shown.offsetWidth;
          shown.classList.add('view-fade');
        }
        if (is3d) fit3D();
        try {
          localStorage.setItem('nlnav-view', view);
        } catch {
          /* 隐私模式下忽略 */
        }
      }

      /* 每格一个盒子：只画需要的侧面；侧面带由地面向上渐亮的遮蔽，营造体积感 */
      function box3D(x, y, kind, faces, extra) {
        const inset = INSET3[kind],
          h = H3[kind],
          s = C3 - 2 * inset,
          f = FACE3[kind];
        const ao = (dir) => `linear-gradient(${dir},rgba(0,0,0,.2),rgba(0,0,0,0) 75%)`;
        const radius = kind === 'wall' ? 0 : 4;
        let o = `<div class="box3d" data-x="${x}" data-y="${y}" style="left:${x * C3 + inset}px;top:${y * C3 + inset}px;width:${s}px;height:${s}px">`;
        if (faces.n) o += `<i style="left:0;top:0;width:${s}px;height:${h}px;background:${ao('180deg')},${f.n};transform:rotateX(90deg)"></i>`;
        if (faces.s) o += `<i style="left:0;top:${s}px;width:${s}px;height:${h}px;background:${ao('180deg')},${f.s};transform:rotateX(90deg)"></i>`;
        if (faces.w) o += `<i style="left:0;top:0;width:${h}px;height:${s}px;background:${ao('90deg')},${f.w};transform:rotateY(-90deg)"></i>`;
        if (faces.e) o += `<i style="left:${s}px;top:0;width:${h}px;height:${s}px;background:${ao('90deg')},${f.e};transform:rotateY(-90deg)"></i>`;
        o += `<i class="top" style="left:0;top:0;width:${s}px;height:${s}px;border-radius:${radius}px;background:${f.top};transform:translateZ(${h}px)">${extra}</i></div>`;
        return o;
      }

      function build3D() {
        const m = state.map,
          Wp = m.width * C3,
          Hp = m.height * C3,
          W = m.width * CELL,
          H = m.height * CELL;
        const world = $('world3d');
        Object.assign(world.style, {
          width: `${Wp}px`,
          height: `${Hp}px`,
          left: `calc(50% - ${Wp / 2}px)`,
          top: `calc(50% - ${Hp / 2}px)`,
        });
        const T = 16; // 底板厚度
        let h = '';
        const [pa, pb] = ART.plateSide;
        h += `<div class="plate-side" style="left:-7px;top:${Hp + 7}px;width:${Wp + 14}px;height:${T}px;background:linear-gradient(${pa},${pb});transform:rotateX(-90deg)"></div>`;
        h += `<div class="plate-side" style="left:-7px;top:-7px;width:${Wp + 14}px;height:${T}px;background:${pb};transform:rotateX(-90deg)"></div>`;
        h += `<div class="plate-side" style="left:${Wp + 7}px;top:-7px;width:${T}px;height:${Hp + 14}px;background:linear-gradient(90deg,${pa},${pb});transform:rotateY(90deg)"></div>`;
        h += `<div class="plate-side" style="left:-7px;top:-7px;width:${T}px;height:${Hp + 14}px;background:linear-gradient(90deg,${pa},${pb});transform:rotateY(90deg)"></div>`;
        // 地面：沿用二维的坐标单位，路线、区域等图层可直接复用二维生成的 SVG 片段
        let f = `<svg class="floor3d" width="${Wp}" height="${Hp}" viewBox="0 0 ${W} ${H}"><defs><pattern id="f3tiles" width="${CELL * 2}" height="${CELL * 2}" patternUnits="userSpaceOnUse"><rect width="${CELL * 2}" height="${CELL * 2}" fill="${ART.floor}"/><rect width="${CELL}" height="${CELL}" fill="${ART.floorAlt}"/><rect x="${CELL}" y="${CELL}" width="${CELL}" height="${CELL}" fill="${ART.floorAlt}"/></pattern></defs>`;
        f += `<rect width="${W}" height="${H}" fill="url(#f3tiles)"/>`;
        let gl = '';
        for (let x = 1; x < m.width; x++) gl += `M${x * CELL} 0V${H}`;
        for (let y = 1; y < m.height; y++) gl += `M0 ${y * CELL}H${W}`;
        f += `<path d="${gl}" stroke="${ART.grid}" stroke-width="1" fill="none"/>`;
        m.locations.forEach((l) => {
          const c = CATEGORY[l.category].color;
          if (l.area) {
            const a = l.area,
              wide = l.category === 'storage' || l.category === 'corridor';
            f += `<rect x="${a.x * CELL + 3}" y="${a.y * CELL + 3}" width="${a.w * CELL - 6}" height="${a.h * CELL - 6}" rx="10" fill="${c}" fill-opacity="${wide ? 0.06 : 0.12}" stroke="${c}" stroke-opacity="${wide ? 0.3 : 0.45}" stroke-width="1.2" ${wide ? 'stroke-dasharray="4 4"' : ''}/>`;
          }
          const ax = (l.anchor.x + 0.5) * CELL,
            ay = (l.anchor.y + 0.5) * CELL;
          f += `<circle cx="${ax}" cy="${ay}" r="5.5" fill="${ART.anchorFill}" stroke="${c}" stroke-width="2.4"/><circle cx="${ax}" cy="${ay}" r="1.8" fill="${c}"/>`;
        });
        f += `<g id="f3open"></g><g id="f3region"></g><g id="f3explored"></g><g id="f3path"></g><g id="f3traveled"></g></svg>`;
        let cells = '';
        for (let y = 0; y < m.height; y++)
          for (let x = 0; x < m.width; x++)
            cells += `<div class="c3" data-x="${x}" data-y="${y}" style="left:${x * C3}px;top:${y * C3}px;width:${C3}px;height:${C3}px"></div>`;
        const discs = Array.from(
          { length: 8 },
          (_, i) =>
            `<div class="r3-disc" style="transform:translateZ(${2 + i * 2}px);background:${i === 4 ? 'currentColor' : `hsl(240 4% ${68 + i * 3}%)`}"></div>`,
        ).join('');
        const robot = `<div class="robot3d" id="robot3d" data-testid="robot-3d"><div class="r3-shadow"></div><div class="r3-halo"></div><div class="r3-body" id="robot3dBody">${discs}<div class="r3-top" style="transform:translateZ(18px)"><div class="r3-eye"></div><div class="r3-arrow"></div></div></div></div>`;
        world.innerHTML =
          h +
          f +
          `<div class="layer3d" id="hit3d">${cells}</div><div class="layer3d" id="obs3d"></div><div class="layer3d passive" id="labels3d"></div><div class="layer3d passive" id="markers3d"></div>` +
          robot;
        v3.robot = $('robot3d');
        v3.body = $('robot3dBody');
        v3.hover = null;
        v3.status = '';
        $('labels3d').innerHTML = m.locations
          .map(
            (l) =>
              `<div class="bb"><div class="label3d"><i style="background:${CATEGORY[l.category].color}"></i>${esc(l.name)}</div><div class="stem" style="height:34px"></div></div>`,
          )
          .join('');
        v3.labels = m.locations.map((l, i) => ({
          el: $('labels3d').children[i],
          x: (l.anchor.x + 0.5) * C3,
          y: (l.anchor.y + 0.5) * C3,
          z: 4,
        }));
        v3.markers = [];
        fit3D();
      }

      /*
       * 墙体合并：顶面按“行内连续段 + 上下行同段”合并成矩形，侧面按行/列连续段合并成长条，消除逐格接缝。
       * 合并后的面用 data-ox/oy（起始格）与 data-dir（x/y/xy）标注，点击时由 offsetX/offsetY 反推格子。
       */
      function wallRuns3D(m, isWall) {
        const hW = H3.wall,
          f = FACE3.wall;
        const ao = (dir) => `linear-gradient(${dir},rgba(0,0,0,.2),rgba(0,0,0,0) 75%)`;
        const rowRuns = (y, test) => {
          const runs = [];
          for (let x = 0; x < m.width; ) {
            if (!test(x, y)) {
              x++;
              continue;
            }
            const s = x;
            while (x < m.width && test(x, y)) x++;
            runs.push([s, x]);
          }
          return runs;
        };
        const colRuns = (x, test) => {
          const runs = [];
          for (let y = 0; y < m.height; ) {
            if (!test(x, y)) {
              y++;
              continue;
            }
            const s = y;
            while (y < m.height && test(x, y)) y++;
            runs.push([s, y]);
          }
          return runs;
        };
        let o = '';
        // 顶面：贪心合并成矩形
        const used = new Set();
        const runsByRow = Array.from({ length: m.height }, (_, y) => rowRuns(y, isWall));
        runsByRow.forEach((runs, y) =>
          runs.forEach(([s, e]) => {
            if (used.has(`${y}:${s}:${e}`)) return;
            let y2 = y + 1;
            while (y2 < m.height && runsByRow[y2].some(([a, b]) => a === s && b === e)) {
              used.add(`${y2}:${s}:${e}`);
              y2++;
            }
            o += `<i class="wall-face" data-ox="${s}" data-oy="${y}" data-dir="xy" style="left:${s * C3}px;top:${y * C3}px;width:${(e - s) * C3}px;height:${(y2 - y) * C3}px;background:${f.top};transform:translateZ(${hW}px)"></i>`;
          }),
        );
        // 南北侧面：行内连续段
        for (let y = 0; y < m.height; y++) {
          rowRuns(y, (x, yy) => isWall(x, yy) && !isWall(x, yy + 1)).forEach(([s, e]) => {
            o += `<i class="wall-face" data-ox="${s}" data-oy="${y}" data-dir="x" style="left:${s * C3}px;top:${(y + 1) * C3}px;width:${(e - s) * C3}px;height:${hW}px;background:${ao('180deg')},${f.s};transform:rotateX(90deg)"></i>`;
          });
          rowRuns(y, (x, yy) => isWall(x, yy) && !isWall(x, yy - 1)).forEach(([s, e]) => {
            o += `<i class="wall-face" data-ox="${s}" data-oy="${y}" data-dir="x" style="left:${s * C3}px;top:${y * C3}px;width:${(e - s) * C3}px;height:${hW}px;background:${ao('180deg')},${f.n};transform:rotateX(90deg)"></i>`;
          });
        }
        // 东西侧面：列内连续段
        for (let x = 0; x < m.width; x++) {
          colRuns(x, (xx, y) => isWall(xx, y) && !isWall(xx - 1, y)).forEach(([s, e]) => {
            o += `<i class="wall-face" data-ox="${x}" data-oy="${s}" data-dir="y" style="left:${x * C3}px;top:${s * C3}px;width:${hW}px;height:${(e - s) * C3}px;background:${ao('90deg')},${f.w};transform:rotateY(-90deg)"></i>`;
          });
          colRuns(x, (xx, y) => isWall(xx, y) && !isWall(xx + 1, y)).forEach(([s, e]) => {
            o += `<i class="wall-face" data-ox="${x}" data-oy="${s}" data-dir="y" style="left:${(x + 1) * C3}px;top:${s * C3}px;width:${hW}px;height:${(e - s) * C3}px;background:${ao('90deg')},${f.e};transform:rotateY(-90deg)"></i>`;
          });
        }
        return `<div class="box3d" style="left:0;top:0;width:0;height:0">${o}</div>`;
      }

      function update3DObstacles() {
        if (!$('obs3d')) return;
        const m = state.map;
        const closedCells = new Set();
        m.passages.forEach((p) => {
          if (state.closed.has(p.id)) p.cells.forEach((c) => closedCells.add(key(c)));
        });
        const kindAt = (x, y) => {
          if (x < 0 || y < 0 || x >= m.width || y >= m.height) return 'void';
          const k = `${x},${y}`;
          if (closedCells.has(k)) return 'barrier';
          if (state.blocked.has(k)) return 'dyn';
          const t = terrainAt(m, { x, y });
          return t !== 'floor' && !state.cleared.has(k) ? t : null;
        };
        const all = { n: true, s: true, e: true, w: true };
        let h = wallRuns3D(m, (x, y) => kindAt(x, y) === 'wall');
        for (let y = 0; y < m.height; y++)
          for (let x = 0; x < m.width; x++) {
            const kind = kindAt(x, y);
            if (!kind || kind === 'wall') continue;
            const faces = all;
            let extra = '';
            if (kind === 'shelf')
              extra = `<b style="left:4px;top:4px;width:11px;height:11px;background:${BOX_COLORS[(x * 7 + y * 3) % 5]}"></b><b style="right:4px;bottom:5px;width:10px;height:9px;background:${BOX_COLORS[(x * 5 + y * 11 + 2) % 5]}"></b>`;
            else if (kind === 'machine')
              extra = `<b class="led" style="right:5px;top:5px"></b><b style="left:6px;bottom:7px;width:13px;height:2px;background:rgba(255,255,255,.45)"></b>`;
            else if (kind === 'table')
              extra = `<b style="left:8px;top:8px;width:12px;height:9px;background:rgba(255,255,255,.5)"></b>`;
            h += box3D(x, y, kind, faces, extra);
          }
        $('obs3d').innerHTML = h;
        let f = '';
        m.passages.forEach((p) => {
          if (!state.closed.has(p.id))
            f += `<path d="${rectPath(p.cells, 4, 7)}" fill="rgba(0,113,227,.06)" stroke="${ART.passageOpen}" stroke-width="1.2" stroke-dasharray="3 3"/>`;
        });
        [...state.cleared].map(parseKey).forEach((c) => {
          f += `<rect x="${c.x * CELL + 4}" y="${c.y * CELL + 4}" width="${CELL - 8}" height="${CELL - 8}" rx="6" fill="rgba(48,209,88,.1)" stroke="${ART.cleared}" stroke-width="1.2" stroke-dasharray="3 3"/>`;
        });
        set3D('f3open', f);
      }

      function render3DMarkers(snap) {
        const host = $('markers3d');
        if (!host) return;
        const list = [];
        let h = '';
        if (snap) {
          const st = snap.path[0];
          h += `<div class="bb"><div class="start3d">起</div><div class="stem" style="height:12px"></div></div>`;
          // 标记悬浮在机器人（高 18px）上方，机器人停在起点或终点时不会被遮挡
          list.push({ x: (st.x + 0.5) * C3, y: (st.y + 0.5) * C3, z: 24 });
          snap.waypointIndices.forEach((wi, i) => {
            const c = snap.path[wi];
            if (!c) return;
            const done = i < snap.nextWaypoint,
              lbl = snap.waypointIndices.length === 1 ? '终' : String(i + 1);
            h += `<div class="bb" style="opacity:${done ? 0.55 : 1}"><div class="pin3d" style="background:${SEGMENT_COLORS[i % SEGMENT_COLORS.length]}"><span>${done ? '✓' : lbl}</span></div><div class="stem" style="height:14px"></div></div>`;
            list.push({ x: (c.x + 0.5) * C3, y: (c.y + 0.5) * C3, z: 24 });
          });
        }
        host.innerHTML = h;
        v3.markers = list.map((p, i) => ({ ...p, el: host.children[i] }));
        applyBillboards();
      }

      function draw3DRobot(pose, status, cellK, heading) {
        const r = v3.robot;
        if (!r) return;
        if (!pose) {
          r.style.display = 'none';
          return;
        }
        r.style.display = '';
        r.style.transform = `translate3d(${((pose.x + 0.5) * C3).toFixed(2)}px,${((pose.y + 0.5) * C3).toFixed(2)}px,0)`;
        v3.body.style.transform = `rotateZ(${heading.toFixed(2)}deg)`;
        if (v3.status !== status) {
          r.style.color = STATUS_COLOR[status] || STATUS_COLOR.idle;
          r.classList.toggle('running', status === 'running');
          r.dataset.status = status;
          v3.status = status;
        }
        r.dataset.cell = cellK;
      }

      /* ---------- 相机：世界整体旋转；标签与图钉做“广告牌”反向旋转，始终面向镜头 ---------- */
      function applyCamera(animate = false) {
        const w = $('world3d');
        if (!w) return;
        const tr = animate ? 'transform .7s cubic-bezier(.25,.1,.25,1)' : 'none';
        w.style.transition = tr;
        // 斜视时远端被压缩、整体视觉重心下沉，按俯仰角把场景略微上移以保持居中
        const lift = (-9 * Math.sin((cam.pitch * Math.PI) / 180)).toFixed(2);
        w.style.transform = `translateY(${lift}%) scale(${(cam.fit * cam.zoom).toFixed(4)}) rotateX(${cam.pitch}deg) rotateZ(${cam.yaw}deg)`;
        applyBillboards(tr);
      }
      function applyBillboards(transition) {
        const rot = `rotateZ(${-cam.yaw}deg) rotateX(${-cam.pitch}deg)`;
        for (const b of [...v3.labels, ...v3.markers]) {
          if (!b.el) continue;
          if (transition !== undefined) b.el.style.transition = transition;
          b.el.style.transform = `translate3d(${b.x}px,${b.y}px,${b.z}px) ${rot} translate(-50%,-100%)`;
        }
      }
      function fit3D() {
        const st = $('stage3d');
        if (!st || st.style.display === 'none' || !st.clientWidth) return;
        const Wp = state.map.width * C3,
          Hp = state.map.height * C3;
        cam.fit = Math.min(st.clientWidth / (Wp * 1.2), st.clientHeight / (Hp * 1.0));
        applyCamera(false);
      }

      function cellOf3D(target, ev) {
        if (!target || !target.closest) return null;
        const run = target.closest('[data-ox]');
        if (run && ev) {
          const ox = +run.dataset.ox,
            oy = +run.dataset.oy,
            dir = run.dataset.dir;
          const x = dir === 'y' ? ox : ox + Math.floor(Math.max(0, ev.offsetX) / C3);
          const y = dir === 'x' ? oy : oy + Math.floor(Math.max(0, ev.offsetY) / C3);
          return x >= 0 && y >= 0 && x < state.map.width && y < state.map.height ? { x, y } : null;
        }
        const el = target.closest('[data-x]');
        return el ? { x: +el.dataset.x, y: +el.dataset.y } : null;
      }
      function hover3D(c, ev) {
        const tip = $('tooltip3d');
        if (v3.hover) v3.hover.classList.remove('hover');
        v3.hover = null;
        if (!c) {
          tip.style.display = 'none';
          return;
        }
        paintCell(c);
        const el = $('hit3d') && $('hit3d').children[c.y * state.map.width + c.x];
        if (el) {
          el.classList.add('hover');
          v3.hover = el;
        }
        const r = $('stage3d').getBoundingClientRect();
        tip.textContent = cellInfo(c);
        tip.style.left = `${ev.clientX - r.left}px`;
        tip.style.top = `${ev.clientY - r.top}px`;
        tip.style.display = 'block';
      }

      function setup3D() {
        const st = $('stage3d');
        const icons = { left: ICONS.rotL, right: ICONS.rotR, top: ICONS.topView, reset: ICONS.target };
        $('ctrl3d')
          .querySelectorAll('button')
          .forEach((b) => (b.innerHTML = icons[b.dataset.act]));
        st.addEventListener('contextmenu', (e) => e.preventDefault());
        st.addEventListener('pointerdown', (ev) => {
          if (ev.target.closest('.ctrl3d')) return;
          const c = cellOf3D(ev.target, ev);
          // 浏览模式下拖动旋转、单击等同于点格子；编辑/放置模式下左键操作格子，右键或中键拖动旋转
          if (ev.button !== 0 || state.mode === 'view' || !c) {
            cam.drag = { x: ev.clientX, y: ev.clientY, yaw: cam.yaw, pitch: cam.pitch, moved: false, cell: c, button: ev.button };
            st.setPointerCapture(ev.pointerId);
            return;
          }
          handleCellDown(c, null);
        });
        st.addEventListener('pointermove', (ev) => {
          const d = cam.drag;
          if (d) {
            const dx = ev.clientX - d.x,
              dy = ev.clientY - d.y;
            if (!d.moved && Math.hypot(dx, dy) > 4) {
              d.moved = true;
              st.classList.add('dragging');
              hover3D(null);
            }
            if (d.moved) {
              cam.yaw = d.yaw + dx * 0.35;
              cam.pitch = clamp(d.pitch - dy * 0.3, 8, 78);
              applyCamera(false);
            }
            return;
          }
          hover3D(cellOf3D(ev.target, ev), ev);
        });
        const end = () => {
          const d = cam.drag;
          if (d) {
            cam.drag = null;
            st.classList.remove('dragging');
            if (!d.moved && d.button === 0 && d.cell) handleCellDown(d.cell, null);
          }

        st.addEventListener('pointercancel', end);

        if (window.ResizeObserver) new ResizeObserver(() => state.view === '3d' && fit3D()).observe(st);
