      /* =====================================================================
       * 13. 随机地图：可复现（同一种子得到同一张图），保证全部空地连通，
       *     用隔墙 + 两处通道制造“绕行 / 不可达”场景，并自动生成带期望结果的预设
       * ===================================================================== */
      function mulberry32(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const RANDOM_PLACES = [
        { id: 'rest-area', name: '休息区', aliases: ['休息室', '茶水间'], category: 'rest' },
        { id: 'storage', name: '仓库', aliases: ['库房', '储物间'], category: 'storage' },
        { id: 'office', name: '办公室', aliases: ['值班室'], category: 'office' },
        { id: 'equipment', name: '设备间', aliases: ['机房', '设备室'], category: 'equipment' },
        { id: 'dock', name: '装卸区', aliases: ['卸货区', '月台'], category: 'dock' },
        { id: 'lab-1', name: '实验室', aliases: ['实验间'], category: 'lab' },
      ];

      function generateRandomMap(seed) {
        const rnd = mulberry32(seed);
        const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
        const shuffle = (arr) => {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(rnd() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        };
        const W = ri(18, 24),
          H = ri(11, 14);
        const g = Array.from({ length: H }, (_, y) =>
          Array.from({ length: W }, (_, x) => (x === 0 || y === 0 || x === W - 1 || y === H - 1 ? '#' : '.')),
        );
        // 隔墙：把地图分成左右两区，只留一扇门和一条双格通道
        const dx = ri(Math.floor(W / 2) - 1, Math.floor(W / 2) + 1);
        for (let y = 1; y < H - 1; y++) g[y][dx] = '#';
        const doorY = ri(2, Math.floor(H / 2) - 2);
        const corY = ri(Math.floor(H / 2) + 1, H - 3);
        [doorY, corY, corY + 1].forEach((y) => (g[y][dx] = '.'));
        const passages = [
          { id: 'north-door', name: '北门', cells: [{ x: dx, y: doorY }] },
          { id: 'central-corridor', name: '中央通道', cells: [{ x: dx, y: corY }, { x: dx, y: corY + 1 }] },
        ];
        const passageKeys = new Set(passages.flatMap((p) => p.cells.map(key)));
        const free = (x, y) => g[y] && g[y][x] === '.';
        const allConnected = () => {
          let total = 0,
            start = null;
          for (let y = 0; y < H; y++)
            for (let x = 0; x < W; x++)
              if (free(x, y)) {
                total++;
                start = start || { x, y };
              }
          if (!start) return false;
          const seen = new Set([key(start)]),
            q = [start];
          for (let i = 0; i < q.length; i++)
            for (const d of DIRS) {
              const n = { x: q[i].x + d.dx, y: q[i].y + d.dy };
              if (free(n.x, n.y) && !seen.has(key(n))) {
                seen.add(key(n));
                q.push(n);
              }
            }
          return seen.size === total;
        };
        // 在格子集合上尝试放置障碍：不得碰到通道附近、不得破坏连通性，否则回滚
        const tryPlace = (cells, ch, guard = () => true) => {
          if (!cells.every((c) => free(c.x, c.y) && Math.abs(c.x - dx) > 1 && guard(c))) return false;
          cells.forEach((c) => (g[c.y][c.x] = ch));
          if (allConnected()) return true;
          cells.forEach((c) => (g[c.y][c.x] = '.'));
          return false;
        };
        // 家具：货架成排、桌台成组、设备单个
        const furniture = ri(7, 11);
        for (let n = 0, tries = 0; n < furniture && tries < 200; tries++) {
          const ch = ['S', 'S', 'T', 'T', 'M'][ri(0, 4)];
          const w = ch === 'M' ? 1 : ri(1, 3),
            h = ch === 'M' ? 1 : ri(1, 2);
          const x0 = ri(2, W - 2 - w),
            y0 = ri(2, H - 2 - h);
          const cells = [];
          for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) cells.push({ x, y });
          if (tryPlace(cells, ch)) n++;
        }
        // 地点：入口在左侧边缘，工作台A在左区，工作台B与充电区在右区（制造跨区与“名称不明确”）
        const extras = shuffle([...RANDOM_PLACES]).slice(0, ri(2, 3));
        const specs = [
          { id: 'entrance', name: '入口', aliases: ['门口', '大门'], category: 'entrance', side: 'edge' },
          { id: 'workbench-a', name: '工作台A', aliases: ['A号工作台', '1号工作台', 'A工作台'], category: 'workbench', side: 'left', bench: true },
          { id: 'workbench-b', name: '工作台B', aliases: ['B号工作台', '2号工作台', 'B工作台'], category: 'workbench', side: 'right', bench: true },
          { id: 'charging', name: '充电区', aliases: ['充电站', '充电桩'], category: 'charging', side: 'right' },
          ...extras.map((e) => ({ ...e, side: 'any' })),
        ];
        const locations = [];
        const areaOverlap = (a) =>
          locations.some(
            (l) => l.area && a.x < l.area.x + l.area.w && l.area.x < a.x + a.w && a.y < l.area.y + l.area.h && l.area.y < a.y + a.h,
          );
        for (const spec of specs) {
          const candidates = [];
          for (let y = 1; y < H - 1; y++)
            for (let x = 1; x < W - 1; x++) {
              if (!free(x, y) || passageKeys.has(`${x},${y}`) || Math.abs(x - dx) <= 1) continue;
              if (spec.side === 'edge' && x > 2) continue;
              if (spec.side === 'left' && x >= dx) continue;
              if (spec.side === 'right' && x <= dx) continue;
              if (locations.some((l) => manhattan(l.anchor, { x, y }) < 4)) continue;
              candidates.push({ x, y });
            }
          shuffle(candidates);
          let placed = null;
          for (const anchor of candidates) {
            // 工作台：尽量在停靠点北侧摆一张桌子，让“工作台”在地图上看得见
            if (spec.bench && anchor.y > 2) {
              const desk = [-1, 0, 1].map((o) => ({ x: anchor.x + o, y: anchor.y - 1 }));
              const near = desk.every((c) => c.x > 0 && c.x < W - 1 && !passageKeys.has(key(c)));
              if (near) tryPlace(desk, 'T', (c) => !locations.some((l) => eq(l.anchor, c)));
            }
            if (!free(anchor.x, anchor.y) || !allConnected()) continue;
            let area = { x: anchor.x, y: anchor.y, w: 1, h: 1 };
            for (let t = 0; t < 24; t++) {
              const w = ri(2, 3),
                h = 2;
              const a = { x: anchor.x - ri(0, w - 1), y: anchor.y - ri(0, h - 1), w, h };
              const crosses = a.x <= dx && a.x + a.w - 1 >= dx;
              if (a.x < 1 || a.y < 1 || a.x + a.w > W - 1 || a.y + a.h > H - 1 || crosses || areaOverlap(a)) continue;
              area = a;
              break;
            }
            placed = { id: spec.id, name: spec.name, aliases: spec.aliases, category: spec.category, anchor, area };
            break;
          }
          if (placed) locations.push(placed);
        }
        const map = {
          id: 'random',
          name: `随机地图 #${seed}`,
          width: W,
          height: H,
          defaultStart: 'entrance',
          grid: g.map((r) => r.join('')),
          locations,
          passages,
          presets: [],
          seed,
        };
        // 预设：先列出想演示的场景，再用流水线实际跑一遍，把结果写成期望值（圆点颜色因此总是准确的）
        const ids = new Set(locations.map((l) => l.id));
        const name = (id) => locations.find((l) => l.id === id)?.name;
        const extra = locations.find((l) => !['entrance', 'workbench-a', 'workbench-b', 'charging'].includes(l.id));
        const drafts = [
          ids.has('workbench-b') && { label: '跨区导航', text: '从入口去工作台B' },
          ids.has('charging') && { label: '隐式起点', text: '去充电区' },
          ids.has('workbench-a') && ids.has('workbench-b') && { label: '名称不明确', text: '从入口去工作台' },
          { label: '未知地点', text: '去会议室' },
          ids.has('workbench-a') && ids.has('charging') && { label: '多目标巡检', text: '先去工作台A，再去充电区，最后回到入口' },
          ids.has('workbench-b') && { label: '绕行北门', text: '从入口去工作台B', closed: ['central-corridor'] },
          ids.has('workbench-b') && { label: '通道全封闭', text: '从入口去工作台B', closed: ['central-corridor', 'north-door'] },
          extra && { label: '某地到某地', text: `${extra.name}到${name('charging') || name('workbench-b') || '入口'}` },
        ].filter(Boolean);
        // 同一时间只保留一张随机地图：已存在则替换
        const idx = MAPS.findIndex((m) => m.id === 'random');
        if (idx >= 0) MAPS[idx] = map;
        else MAPS.push(map);
        const robot = locations.find((l) => l.id === 'entrance')?.anchor ?? null;
        map.presets = drafts.map((d) => {
          const tr = navigate({ mapId: 'random', text: d.text, robotCell: robot, overrides: { blocked: [], cleared: [], closedPassages: d.closed }, clarifications: {} });
          const steps = tr.stages.plan.status === 'ok' ? tr.stages.plan.data.totalSteps : undefined;
          return {
            label: d.label,
            text: d.text,
            setup: { robotAt: 'entrance', closedPassages: d.closed },
            expect: { outcome: tr.outcome, steps },
          };
        });
        return map;
      }

      function loadRandomMap(seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0) {
        const map = generateRandomMap(seed);
        const opts = MAPS.map((m) => `<option value="${m.id}">${m.name} · ${m.width}×${m.height}</option>`).join('');
        $('mapSelect').innerHTML = opts;
        $('mapSelect').value = 'random';
        selectMap('random');
        toast(`已生成随机地图（种子 ${seed}），可在地址栏加 ?seed=${seed} 复现`);
        return map;
      }

      /* 自检：在控制台执行 __selfTest() 可跑全部预设并核对期望结果与黄金步数 */
      window.__selfTest = function () {
        const rows = [];
        for (const m of MAPS)
          for (const p of m.presets) {
            const robot = m.locations.find((l) => l.id === (p.setup.robotAt || m.defaultStart)).anchor;
            const tr = navigate({
              mapId: m.id,
              text: p.text,
              robotCell: robot,
              overrides: { blocked: [], cleared: [], closedPassages: p.setup.closedPassages },
              clarifications: {},
            });
            const steps = tr.stages.plan.status === 'ok' ? tr.stages.plan.data.totalSteps : null;
            const pass =
              tr.outcome === p.expect.outcome && (p.expect.steps === undefined || steps === p.expect.steps);
            rows.push({
              map: m.id,
              preset: p.label,
              text: p.text,
              expect: `${p.expect.outcome}${p.expect.steps !== undefined ? '/' + p.expect.steps : ''}`,
              got: `${tr.outcome}${steps !== null ? '/' + steps : ''}`,
              pass,
            });
          }
        console.table(rows);
        return rows;
      };
      window.__nlnav = {
        MAPS,
        navigate,
        parseCommand,
        buildParseContext,
        groundCommand,
        planRoute,
        createGrid,
        createSimulator,
        state,
        toggleObstacle,
        onGridChanged,
        setView,
        cam,
        applyCamera,
        applyTheme,
        generateRandomMap,
        loadRandomMap,
      };
      init();
    </script>
  </body>
</html>
